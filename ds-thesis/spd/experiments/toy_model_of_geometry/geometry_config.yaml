# Geometry: 3 x 2-simplexes
# --- WandB ---
wandb_project: Thesis_geometry_sweep_rank_and_minimality
wandb_run_name:  Thesis_geometry_sweep_rank_and_minimality
wandb_run_name_prefix: ""

# --- General ---
seed: 20
C: 50
K: 1
n_mask_samples: 1
n_ci_mlp_neurons: 16
target_module_patterns: ["linear1", "linear2"]

# --- Loss Coefficients ---
faithfulness_coeff: 1.0
recon_coeff: null
stochastic_recon_coeff: 1.0
recon_layerwise_coeff: null
stochastic_recon_layerwise_coeff: 1.0
importance_minimality_coeff: 5.0e-05
pnorm: 1.0
output_loss_type: mse

# --- Training ---
batch_size: 2048
steps: 40_000
lr: 1e-3
lr_schedule: cosine
lr_warmup_pct: 0.0
n_eval_steps: 100

# --- Logging & Saving ---
image_freq: 5_000
print_freq: 1000
save_freq: null

# --- Pretrained model info ---
pretrained_model_class: "spd.experiments.toy_model_of_geometry.models.GeometryModel"
pretrained_model_path: "C:\\Users\\Knud\\uni\\spd\\spd\\experiments\\toy_model_of_geometry\\out\\smaller_test\\geometry.pth"

# --- Task Specific ---
task_config:
  task_name: geometry
  feature_probability: 0.4
  data_generation_type: "at_least_zero_active"